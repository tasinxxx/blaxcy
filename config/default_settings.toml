# BLAXCY default configuration.
#
# This file is the packaged, reference set of defaults and the merge base for
# a user config at ~/.config/blaxcy/config.toml. It never contains secrets --
# the Gemini API key lives in the OS keyring (specification section 69).
#
# Security invariants are enforced in code (config/settings.py); disabling
# terminal confirmation or credential-context privacy here will make BLAXCY
# refuse to start rather than run in an unsafe state (sections 4 rule 25, 72).

schema_version = 1

[performance]
# Cap on concurrent READ_ONLY tool dispatch (section 32.1). Read-only work does
# not need the single-writer T-EXEC lock, but it must stay bounded.
max_concurrent_readonly_dispatch = 4

[capture]
# Adaptive capture targets, not guarantees (section 33).
idle_fps = 2.0
normal_fps = 10.0
active_fps = 30.0
max_full_frames = 2
max_thumbnails = 8

[perception]
pixel_threshold = 12
meaningful_min_width = 80
meaningful_min_height = 24
meaningful_area_ratio = 0.015
major_area_ratio = 0.30
debounce_short_ms = 120
debounce_major_ms = 300
max_perception_jobs_per_second = 5
animation_recheck_seconds = 3.0

[accessibility]
method_timeout_ms = 250
startup_timeout_ms = 1000
max_depth = 12
max_nodes = 1200
deadline_ms = 1000
cache_ttl_seconds = 2.0
blacklist_after_failures = 3

[ocr]
minimum_width = 40
minimum_height = 14
max_regions = 6
max_area_ratio = 0.015
deadline_ms = 300

[visual]
# Visual grounding is the final perception fallback (section 41): the only source
# that uploads screen pixels to a remote model. It is never reached in OBSERVE --
# the grounder and policy both require mode >= ASSIST -- and credential context is
# never uploaded (sections 42, 55). `max_confidence` is capped at the section 41
# ceiling of 0.80 and can only be lowered; the same bound is enforced in code.
enabled = true
max_image_side = 1024
max_confidence = 0.80
max_results = 3
model_timeout_ms = 12000

[resolver]
act_threshold = 0.65
max_candidates = 5
ambiguity_gap = 0.08
weight_text = 0.40
weight_source = 0.20
weight_role = 0.15
weight_context = 0.15
weight_geometry = 0.10

[resolver_cache]
# Enabled by default now that the section 43.1/75 test list is green. A hit is
# only a traversal-order hint: it is re-queried and re-scored live, and disabling
# it produces identical (only slower) targeting decisions (sections 4 rule 31,
# 43.1). It stays a switch so an operator can turn it off without a code change.
enabled = true
max_entries = 256
ttl_seconds = 10.0
semantic_match_floor = 70

[sequence]
# The batching layer is enabled by default: Phase 9's safety gate passed and the
# section 66.1/75 batching test list is green (sections 83, 84). Batching removes
# Brain round-trips, never a policy/resolve/lease/revalidate/execute/verify step.
# `enabled = false` refuses `run_sequence` outright; OBSERVE mode also refuses it.
enabled = true
max_sequence_steps = 12
max_sequence_wall_clock_seconds = 60.0
# Scheduling (section 33.1) and read-side prefetch (section 33.2) layers, both
# proven safe by the section 33.1/33.2/75 tests. Turning either off can only
# remove capability, never remove a check.
capture_boost = true
speculative_perception = true

[input]
# Physical input timing (sections 48-52). These are behavioural knobs, not
# safety switches: disabling the focus guard never creates another path to
# unverified typing, it only removes the extra pre-typing check.
mouse_settle_ms = 40
post_click_settle_ms = 120
pointer_readback_tolerance_px = 4
max_pointer_corrections = 1
ascii_direct_max = 200
key_interval_ms = 10
guard_focus = true

[clipboard]
# Clipboard-assisted typing (section 50). Not safety switches: disabling the
# paster only removes the capability, so long/non-ASCII text then fails honestly
# with UNICODE_UNSUPPORTED instead of being typed.
#
# An X selection is served lazily: the target asks the owner for the data after
# the paste keystroke, so BLAXCY must keep answering afterwards (paste_grace_ms)
# and must serve the clipboard's previous content for a moment before handing
# ownership back (restore_grace_ms), which is what lets a clipboard manager
# capture it.
enabled = true
paste_grace_ms = 400
restore_grace_ms = 400
read_timeout_ms = 300
max_bytes = 262144

[lease]
# Section 44. This bound must exceed one real perception cycle, because section 45
# revalidates a lease against a *fresh* observation and that observation has to be
# produced inside the lease's lifetime. Measured on this host, a real re-perception
# (capture + AT-SPI traversal + OCR pass over 172 elements, 8 s traversal budget)
# costs 0.68-1.36 s, so an 800 ms bound expired during the very re-perception meant
# to validate it and no target action could ever be authorised. 3000 ms leaves room
# for that cycle plus the enqueueing and verification that follow it. The other
# section 45 guarantees (state freshness, generation, identity, geometry drift) are
# unchanged and remain the checks that actually decide.
ttl_ms = 3000

[verification]
max_action_state_age_ms = 1500
require_verification_for_mutating = true
# A negative verdict (UNVERIFIED/CONTRADICTED) is re-checked against fresh, live
# observations for this long before it is reported. section 60's CONTRADICTED
# needs positive evidence, and one read taken right after injection is not that
# when the application has not applied the input yet. A VERIFIED verdict is never
# delayed by this window.
verify_settle_ms = 1000
verify_poll_ms = 150

[recovery]
automatic_attempts_per_tool = 2
attempts_per_task_step = 6
identical_call_loop_guard = 3

[safety]
# First launch is always OBSERVE (section 56).
mode = "OBSERVE"
autonomous_max_session_duration_minutes = 30
emergency_stop_target_ms = 150
# Section 58 deny-list: no input, no visual upload, no autonomous override, and
# any in-flight sequence halts while one of these owns the active window.
# Substring match, case-folded, against app name / window title / window class.
blocked_applications = []
# Section 42 privacy list: content from these applications is never uploaded to
# a visual model (they may still be typed into; they are not blocked).
protected_applications = []

[terminal]
submit_requires_confirmation = true
destructive_always_protected = true

[privacy]
visual_upload_on_demand_only = true
never_upload_credential_context = true
never_ocr_password_fields = true

[logging]
level = "INFO"
rotation_max_bytes = 10485760
rotation_backups = 5
redact_on_root_logger = true

[gemini]
# Re-verified 2026-09-26: the 2.5 family returns 404 for new API users; this is
# the replacement the API names. Override freely if your key has access to more.
model = "gemini-3.8-flash"
max_model_turns = 40
max_task_wall_clock_seconds = 300
context_token_budget = 1200
