[build-system]
# setuptools >= 77 is required for the PEP 639 SPDX license expression below; the
# older TOML-table form is deprecated and this keeps the build warning-free on
# current and future setuptools.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blaxcy"
version = "0.1.0"
description = "BLAXCY - a Linux-native AI computer-control BODY (perception, control, policy, verification, recovery)."
readme = "README.md"
requires-python = ">=3.12"
# A PEP 639 SPDX expression. "Proprietary" is not a valid SPDX identifier, so
# the license is expressed as a forbidden-use statement the SPDX grammar accepts;
# the full terms are distributed with the source.
license = "LicenseRef-Proprietary"
authors = [{ name = "BLAXCY" }]

# Runtime dependencies. Versions are intentionally lower-bounded, not pinned:
# the specification forbids pinning arbitrary versions without checking real
# compatibility, and every capability must be probed functionally at runtime.
dependencies = [
    "PySide6",
    "google-genai",
    "mss",
    "numpy",
    "opencv-python-headless",
    "pytesseract",
    "Pillow",
    "python-xlib",
    "keyring",
    "SecretStorage",
    "rapidfuzz",
    "xxhash",
    "psutil",
    "pydantic>=2",
    "tomlkit",
]

[project.optional-dependencies]
# The default developer set is exactly what the test suite needs. ``pytest-qt``
# is deliberately *not* here: the section 71 GUI tests build their own offscreen
# ``QApplication`` (tests/harness/gui.py) and never request the ``qtbot`` fixture,
# so no test needs the plugin -- while the plugin imports ``QtTest`` in its own
# ``pytest_configure`` and aborts the whole session with an INTERNALERROR on any
# host whose Qt binding lacks that module (Debian/Ubuntu ship PySide6 split into
# per-module packages). Requiring an unused plugin that can crash collection is
# what made a bare ``pytest`` fail; the ``gui-test`` extra below is opt-in for a
# host that wants the fixture and has a Qt binding which really ships ``QtTest``.
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-benchmark",
    "mypy",
    "ruff",
    "black",
]
gui-test = [
    "pytest-qt",
]

[project.scripts]
blaxcy = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = [
    "config",
    "security",
    "schemas",
    "core",
    "control",
    "control.backends",
    "policy",
    "ai",
    "gui",
    "watchdog",
    "bench",
    "installer",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
# ``pytest-qt`` is optional (see the ``gui-test`` extra). When it is installed
# on a host that ships ``QtTest`` it loads normally; nothing here disables it in
# that case, and ``testpaths``/``addopts`` are the plain documented command.
markers = [
    "safety: Phase 9 safety-critical tests (policy/executor/verifier/recovery/emergency stop)",
    "batching: Phase 10.1 batching layer tests (run_sequence/resolver cache/speculative perception)",
    "benchmark: performance benchmarks, not run by default",
    "gui: requires a Qt event loop",
]

[tool.coverage.run]
# Branch coverage, over the shipped source packages (the tests package and the
# desktop/installer scripts are excluded: one is the suite, the other is not
# import-time source). ``source`` here is what a bare ``pytest --cov`` measures.
branch = true
source = [
    "ai",
    "bench",
    "config",
    "control",
    "core",
    "gui",
    "installer",
    "policy",
    "schemas",
    "security",
    "watchdog",
]

[tool.coverage.report]
# A floor, not a target. The whole tree sits at ~87% (branch) and every
# safety-critical module -- policy/*, control/executor.py, control/verifier.py,
# control/recovery.py, control/emergency_stop.py, control/takeover.py,
# control/sequence_runner.py, core/state_cache.py, control/action_tracker.py -- is
# at 91-100%. The gate exists to catch a silent collapse, not to chase a number.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
# Third-party modules without type information are imported but only interacted
# with through guarded, runtime-probed access (Any); missing stubs must not
# block type-checking of BLAXCY's own typed code.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Package-installed-by-others libraries that ship no stubs.
module = ["mss", "mss.*", "Xlib", "Xlib.*", "pytesseract", "pytesseract.*", "gi", "gi.*"]
ignore_missing_imports = true
