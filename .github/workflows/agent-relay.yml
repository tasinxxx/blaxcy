# Trusted Agent -> BLAXCY relay producer.
#
# The Agent never receives the bridge token and never signs tasks. It only
# commits an unsigned Task document under relay/agent-requests. This hosted
# workflow validates it with the same BLAXCY Task parser, signs the canonical
# inner task with BLAXCY_BRIDGE_TOKEN, commits the normal relay envelope, and
# dispatches the existing self-hosted desktop processor.
name: BLAXCY agent relay producer

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: blaxcy-agent-producer
  cancel-in-progress: false

jobs:
  produce:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install producer validation dependencies
        run: python -m pip install --disable-pip-version-check "pydantic>=2,<3" xxhash tomlkit

      - name: Check for pending Agent requests
        id: pending
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          requests=(relay/agent-requests/*.json)
          if [ ${#requests[@]} -eq 0 ]; then
            echo "has_requests=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_requests=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign pending Agent requests
        if: steps.pending.outputs.has_requests == 'true'
        id: sign
        env:
          BLAXCY_BRIDGE_TOKEN: ${{ secrets.BLAXCY_BRIDGE_TOKEN }}
        run: |
          set -eu
          shopt -s nullglob
          requests=(relay/agent-requests/*.json)
          : > "$RUNNER_TEMP/blaxcy-task-ids"
          for request in "${requests[@]}"; do
            [ -f "$request" ] || continue
            python -m relay.agent_producer "$request" --repo .
            python - "$request" <<'PY' >> "$RUNNER_TEMP/blaxcy-task-ids"
import json, sys
print(json.load(open(sys.argv[1], encoding="utf-8"))["task_id"])
PY
          done
          ids=$(paste -sd, "$RUNNER_TEMP/blaxcy-task-ids")
          echo "task_ids=$ids" >> "$GITHUB_OUTPUT"
      - name: Commit signed relay tasks
        if: steps.pending.outputs.has_requests == 'true'
        run: |
          set -eu
          git config user.name "blaxcy-agent-producer"
          git config user.email "blaxcy-agent-producer@users.noreply.github.com"
          git add relay/tasks/ relay/agent-requests/
          rm -f relay/agent-requests/*.json
          git add -u relay/agent-requests/
          git commit -m "relay: sign Agent task request"
          git push

      - name: Dispatch the self-hosted desktop processor
        if: steps.pending.outputs.has_requests == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          IFS=',' read -ra ids <<< "${{ steps.sign.outputs.task_ids }}"
          for task_id in "${ids[@]}"; do
            [ -n "$task_id" ] || continue
            gh workflow run process-task.yml --repo "${{ github.repository }}" --ref master -f task_id="$task_id"
          done